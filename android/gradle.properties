org.gradle.java.home=/usr/lib/jvm/java-21-temurin-jdk

# Enable AndroidX (required by Flutter plugins)
android.useAndroidX=true
android.enableJetifier=true

# Suppress compileSdk 36 warning
android.suppressUnsupportedCompileSdk=36

# Increase Gradle heap for Jetifier (fixes "Java heap space")
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Suppress Java 8 deprecation warnings
android.javaCompile.suppressSourceTargetDeprecationWarning=true
