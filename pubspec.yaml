name: clockwise
description: iSyncPeople - Professional attendance tracking application

publish_to: 'none'

version: 7.8.9+40

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.5
  flutter_local_notifications: ^17.2.4
  http: ^1.2.2
  path_provider: ^2.1.5
  open_file: ^3.5.10
  flutter_svg: ^2.0.17
  pdf: ^3.11.1
  printing: ^5.13.3
  file_picker: ^8.1.7
  table_calendar: ^3.1.3
  flutter_foreground_task: ^8.17.0
  web_socket_channel: ^3.0.0
  in_app_update: ^4.2.5
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true