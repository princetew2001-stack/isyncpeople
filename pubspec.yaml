name: clockwise
description: iSyncPeople - Professional attendance tracking application

publish_to: 'none'

version: 7.7.7+31

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl: ^0.18.1
  geolocator: ^10.1.0
  geocoding: ^4.0.0
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.2
  http: ^1.1.0
  path_provider: ^2.1.5
  open_file: ^3.5.10
  flutter_svg: ^2.0.9
  pdf: ^3.10.4
  printing: ^5.11.0
  file_picker: ^8.1.2
  table_calendar: ^3.0.9
  flutter_foreground_task: ^8.11.0
  web_socket_channel: ^2.4.0
  in_app_update: ^4.2.3
  package_info_plus: ^8.0.0
  google_maps_flutter: ^2.18.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true